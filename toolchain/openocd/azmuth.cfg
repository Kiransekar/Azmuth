# SPDX-License-Identifier: LicenseRef-Azmuth-Proprietary
# OpenOCD target configuration for Azmuth v1.1
# Software audit §S5.1
#
# Usage: openocd -f toolchain/openocd/azmuth.cfg

# JTAG adapter — default to FTDI-based (modify for your probe)
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 1000

# TAP: Azmuth JTAG TAP (per Debug Spec 0.13.2)
# IR length = 5 (standard for RISC-V debug)
jtag newtap azmuth cpu -irlen 5 -expected-id 0x10001FFF

# Target: Azmuth RV32I core
target create azmuth.cpu riscv -chain-position azmuth.cpu
azmuth.cpu configure -work-area-phys 0x00010000 -work-area-size 0x4000

# Flash: QSPI NVM (if present)
# flash bank azmuth.flash fespi 0x20000000 0 0 0 azmuth.cpu

# GDB port
gdb_port 3333
telnet_port 4444
tcl_port 6666

# Reset configuration
reset_config srst_only srst_nogate

# Init and halt on connect
init
halt
